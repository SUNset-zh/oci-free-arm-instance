<title>澳洲储能入行指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0E1620;
    --ink-2: #131D29;
    --line: #243241;
    --text: #E6EBEF;
    --muted: #8595A3;
    --copper: #D9954A;
    --focus: #6FA8C7;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding-inline: 16px;
    padding-block: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: min(1280px, calc((100vh - 140px) * 16 / 9));
    aspect-ratio: 16 / 9;
    background: var(--ink-2);
    border: 1px solid var(--line);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .play {
    position: absolute;
    left: 6.25%; top: 68%;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 26px;
    font: 500 16px/1 "Noto Sans SC", "PingFang SC", sans-serif;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: var(--copper);
    border: 0;
    cursor: pointer;
  }
  .play:focus-visible, .bar button:focus-visible, .bar input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 3px; }
  .play svg { width: 14px; height: 14px; fill: currentColor; }
  .bar {
    width: 100%;
    max-width: min(1280px, calc((100vh - 140px) * 16 / 9));
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    font: 400 13px/1.5 "IBM Plex Mono", ui-monospace, monospace;
    color: var(--muted);
  }
  .bar button {
    font: inherit; color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    padding: 6px 12px;
    cursor: pointer;
  }
  .bar button:hover { border-color: var(--copper); }
  .bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bar .note { margin-left: auto; font-family: "Noto Sans SC", sans-serif; }
  .bar a { color: var(--copper); }
</style>

<div class="stage">
  <canvas id="c" width="1920" height="1080" aria-label="30 秒动画：以中国身份进入澳大利亚储能行业的入行指南"></canvas>
  <button class="play" id="play" type="button">
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0 L10 5 L1 10 Z"/></svg>
    播放（含配乐）
  </button>
</div>
<div class="bar">
  <button id="replay" type="button">重播</button>
  <label><input id="mute" type="checkbox"> <span>静音</span></label>
  <button id="rec" type="button">导出视频 WebM</button>
  <span id="recState"></span>
  <span class="note">配乐由 Web Audio 实时合成 · 导出需在本地浏览器打开此文件</span>
</div>

<script>
(() => {
  const W = 1920, H = 1080, DUR = 30;
  const FS = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
  const MONO = '"IBM Plex Mono",ui-monospace,Menlo,monospace';
  const C = {
    ink: '#0E1620', text: '#E6EBEF', muted: '#8595A3', dim: '#4A5968',
    copper: '#D9954A', cool: '#6FA8C7', warn: '#E07A5F'
  };

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = x => 1 - Math.pow(1 - x, 3);
  const p = (t, a, d) => ease(clamp((t - a) / d, 0, 1));
  const win = (t, s, e, fin = 0.5, fout = 0.45) => Math.min(p(t, s, fin), 1 - p(t, e - fout, fout));

  function text(s, x, y, o = {}) {
    ctx.save();
    ctx.globalAlpha *= (o.a ?? 1);
    ctx.font = `${o.w || 400} ${o.size || 28}px ${o.font || FS}`;
    ctx.fillStyle = o.color || C.text;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = 'alphabetic';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (o.ls || 0) + 'px';
    ctx.fillText(s, x, y);
    ctx.restore();
  }
  function line(x1, y1, x2, y2, color, a = 1, lw = 1) {
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  // ---------- content ----------
  const SCENES = [
    { s: 0,    e: 4 },
    { s: 4,    e: 10,   n: '01', name: '身份路径' },
    { s: 10,   e: 15.5, n: '02', name: '资质准备' },
    { s: 15.5, e: 21.5, n: '03', name: '上岗学习' },
    { s: 21.5, e: 26.5, n: '04', name: '注意事项' },
    { s: 26.5, e: 30 }
  ];

  const VISAS = {
    title: '合法工作身份是第一步',
    sub: '按个人背景选择签证路径，所有工作签证都以雇主或名额为前提',
    color: C.copper,
    items: [
      ['485', '毕业生临时签证', '在澳完成学位者可申请，适合积累本地工作经验'],
      ['482 SID', 'Skills in Demand 雇主担保', '年薪须达到 CSIT 核心技能收入门槛'],
      ['189/190/491', '独立或州担保技术移民', '职业评估 + EOI 打分，名额竞争激烈'],
      ['462', '打工度假签证', '中国护照适用，18–30 岁，每年名额有限'],
      ['外派', '中资储能企业外派', '常见入口，但仍需办理合规的工作签证']
    ]
  };
  const QUALS = {
    title: '把国内学历转成澳洲认可的资质',
    sub: '学历、语言、执照、现场安全，四类门槛缺一不可',
    color: C.copper,
    items: [
      ['EA', 'Engineers Australia 职业评估', '认证专业走华盛顿协议通道，否则提交 CDR 报告'],
      ['IELTS/PTE', '英语成绩', '签证和职业评估各有最低分数要求'],
      ['LICENCE', '州级电气执照', '接线与端接必须持牌，海外资历需单独认可'],
      ['SAA', '电池系统安装认证', '原由 CEC 管理，现由 Solar Accreditation Australia 负责'],
      ['WHITE CARD', '施工安全入门卡', '进入任何施工现场之前必须持有']
    ]
  };
  const ISSUES = {
    title: '上岗后常遇到的问题',
    sub: '提前了解规则，比出了问题再补救成本低得多',
    color: C.warn,
    items: [
      ['VISA', '工作签证与雇主绑定', '离职后通常须在 180 天内找到新担保，否则需离境'],
      ['SOCI', '关键基础设施安全审查', '电网与大型储能属关键资产，部分岗位限制国籍与背景'],
      ['EXP', '本地经验缺口', '第一份工作多从调试、运维、现场技术岗起步'],
      ['DATA', '数据与技术保密', '中澳两地都有数据出境和技术出口的合规要求'],
      ['FIFO', '偏远项目驻场', '飞进飞出轮班制，提前了解轮休与生活安排']
    ]
  };
  const LEARN = [
    { h: '市场规则', en: 'MARKET', items: ['NEM 国家电力市场', 'AEMO 调度与 5 分钟结算', 'FCAS 频率辅助服务', '峰谷套利与报价策略'] },
    { h: '并网技术', en: 'GRID', items: ['NER 第 5 章并网流程', 'GPS 发电机性能标准', 'PSCAD / PSS®E 建模', '调试与 R2 模型验证'] },
    { h: '标准安全', en: 'SAFETY', items: ['AS/NZS 5139 电池安装', 'AS/NZS 4777 逆变器并网', 'AS/NZS 3000 布线规则', 'WHS 职业健康安全法规'] }
  ];

  // ---------- background: 24h net-demand "duck curve" ----------
  const duck = f => 0.52 + 0.14 * Math.exp(-(((f - 0.3) / 0.06) ** 2))
    + 0.36 * Math.exp(-(((f - 0.79) / 0.07) ** 2))
    - 0.42 * Math.exp(-(((f - 0.52) / 0.13) ** 2));

  function drawBackground(t) {
    ctx.fillStyle = C.ink;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 0.04;
    ctx.strokeStyle = C.text;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 120; x <= 1800; x += 120) { ctx.moveTo(x + 0.5, 140); ctx.lineTo(x + 0.5, 960); }
    for (let y = 140; y <= 960; y += 120) { ctx.moveTo(120, y + 0.5); ctx.lineTo(1800, y + 0.5); }
    ctx.stroke();
    ctx.restore();

    // curve occupies lower band, drawn progressively across the whole piece
    const x0 = 120, x1 = 1800, yb = 940, hgt = 300;
    const rev = clamp(t / 28, 0, 1);
    const N = 240, last = Math.floor(N * rev);
    const Y = f => yb - duck(f) * hgt;

    // shaded charge window (midday solar trough) and discharge window (evening peak)
    ctx.save();
    ctx.globalAlpha = 0.05;
    const band = (fa, fb, col) => {
      const xa = x0 + (x1 - x0) * fa, xb = x0 + (x1 - x0) * Math.min(fb, rev);
      if (xb > xa) { ctx.fillStyle = col; ctx.fillRect(xa, 640, xb - xa, yb - 640); }
    };
    band(0.40, 0.64, C.cool);
    band(0.72, 0.87, C.copper);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = C.copper;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= last; i++) {
      const f = i / N, x = x0 + (x1 - x0) * f;
      i ? ctx.lineTo(x, Y(f)) : ctx.moveTo(x, Y(f));
    }
    ctx.stroke();
    ctx.restore();
    if (last > 0) {
      const f = last / N;
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = C.copper;
      ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * f, Y(f), 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    const la = 0.28;
    text('NET DEMAND · NEM · 24H', 1800, 628, { font: MONO, size: 16, color: C.muted, align: 'right', a: la, ls: 2 });
    if (rev > 0.45) text('充电 CHARGE', x0 + (x1 - x0) * 0.52, 928, { font: MONO, size: 15, color: C.cool, align: 'center', a: la * p(t, 12.6, 1) });
    if (rev > 0.80) text('放电 DISCHARGE', x0 + (x1 - x0) * 0.795, 928, { font: MONO, size: 15, color: C.copper, align: 'center', a: la * p(t, 22.4, 1) });
  }

  // ---------- chrome: header + timeline ----------
  function drawChrome(t) {
    text('AU · ENERGY STORAGE · GRADUATE BRIEF', 120, 92, { font: MONO, size: 18, color: C.muted, ls: 3 });
    for (let i = 1; i <= 4; i++) {
      const sc = SCENES[i];
      const a = win(t, sc.s, sc.e, 0.4, 0.3);
      if (a > 0) text(`${sc.n} / 04 · ${sc.name}`, 1800, 92, { font: MONO, size: 18, color: C.copper, align: 'right', a, ls: 2 });
    }
    line(120, 112, 1800, 112, C.text, 0.08);

    const y = 1010, x0 = 120, x1 = 1640;
    line(x0, y, x1, y, C.text, 0.12);
    const px = x0 + (x1 - x0) * clamp(t / DUR, 0, 1);
    line(x0, y, px, y, C.copper, 0.9, 2);
    const marks = [[4, '身份'], [10, '资质'], [15.5, '学习'], [21.5, '注意'], [26.5, '总结']];
    for (const [mt, lab] of marks) {
      const mx = x0 + (x1 - x0) * mt / DUR;
      const on = t >= mt;
      line(mx, y - 6, mx, y + 6, on ? C.copper : C.text, on ? 0.9 : 0.25);
      text(lab, mx, y - 16, { size: 16, color: on ? C.text : C.muted, align: 'center', a: on ? 0.8 : 0.4 });
    }
    const ss = s => '00:' + String(Math.floor(s)).padStart(2, '0');
    text(`${ss(clamp(t, 0, DUR))} / 00:30`, 1800, y + 6, { font: MONO, size: 18, color: C.muted, align: 'right' });
  }

  // ---------- scene 0: title ----------
  function drawTitle(t) {
    const sc = SCENES[0];
    const a = Math.min(p(t, 0.1, 0.8), 1 - p(t, sc.e - 0.45, 0.45));
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    const dy = (1 - p(t, 0.1, 1.0)) * 24;
    text('应届毕业生就业指南 · 2026', 120, 340 + dy, { font: MONO, size: 24, color: C.copper, ls: 3, a: p(t, 0.2, 0.8) });
    text('以中国身份', 120, 450 + dy, { size: 86, w: 700, a: p(t, 0.35, 0.8) });
    text('进入澳大利亚储能行业', 120, 555 + dy, { size: 86, w: 700, a: p(t, 0.55, 0.8) });
    text('签证路径 · 资质准备 · 上岗学习 · 常见问题', 120, 625 + dy, { size: 32, w: 300, color: C.muted, a: p(t, 0.9, 0.8) });

    // battery: 10 cells filling as state of charge
    const bx = 1300, by = 380, bw = 400, bh = 170;
    ctx.save();
    ctx.globalAlpha *= p(t, 0.4, 0.8);
    ctx.strokeStyle = C.text; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = C.text;
    ctx.fillRect(bx + bw, by + bh / 2 - 26, 12, 52);
    const soc = p(t, 0.8, 2.6);
    const cells = 10, gap = 8, cw = (bw - 16 - gap * (cells - 1)) / cells;
    for (let i = 0; i < cells; i++) {
      const fill = clamp(soc * cells - i, 0, 1);
      if (fill <= 0) continue;
      ctx.globalAlpha = a * fill;
      ctx.fillStyle = C.copper;
      ctx.fillRect(bx + 8 + i * (cw + gap), by + 8, cw, bh - 16);
    }
    ctx.restore();
    text(`SOC ${String(Math.round(soc * 100)).padStart(3, ' ')}%`, bx, by + bh + 44, { font: MONO, size: 22, color: C.muted, a: p(t, 0.8, 0.6) });
    text('BESS', bx + bw, by + bh + 44, { font: MONO, size: 22, color: C.muted, align: 'right', a: p(t, 0.8, 0.6) });
    ctx.restore();
  }

  // ---------- list scenes ----------
  function drawList(t, sc, d) {
    const a = win(t, sc.s, sc.e);
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    const hy = (1 - p(t, sc.s, 0.6)) * 20;
    text(sc.n, 120, 232 + hy, { font: MONO, size: 30, color: d.color, w: 500 });
    text(d.title, 190, 232 + hy, { size: 54, w: 700 });
    text(d.sub, 190, 282 + hy, { size: 26, w: 300, color: C.muted, a: p(t, sc.s + 0.2, 0.6) });

    d.items.forEach((it, i) => {
      const st = sc.s + 0.45 + i * 0.3;
      const k = p(t, st, 0.55);
      if (k <= 0) return;
      const y = 380 + i * 108;
      const dx = (1 - k) * 36;
      ctx.save();
      ctx.globalAlpha *= k;
      ctx.fillStyle = d.color;
      ctx.fillRect(120 + dx, y - 20, 10, 10);
      text(it[0], 150 + dx, y - 8, { font: MONO, size: 24, color: d.color, w: 500, ls: 1 });
      text(it[1], 470 + dx, y - 4, { size: 34, w: 500 });
      text(it[2], 470 + dx, y + 36, { size: 24, w: 300, color: C.muted });
      ctx.restore();
      line(120, y + 60, 120 + 1680 * k, y + 60, C.text, 0.08 * k);
    });
    ctx.restore();
  }

  // ---------- scene 3: learning grid ----------
  function drawLearn(t) {
    const sc = SCENES[3];
    const a = win(t, sc.s, sc.e);
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    const hy = (1 - p(t, sc.s, 0.6)) * 20;
    text(sc.n, 120, 232 + hy, { font: MONO, size: 30, color: C.cool, w: 500 });
    text('到岗后要补的三门课', 190, 232 + hy, { size: 54, w: 700 });
    text('国内学的是原理，澳洲项目考的是本地规则与标准', 190, 282 + hy, { size: 26, w: 300, color: C.muted, a: p(t, sc.s + 0.2, 0.6) });

    LEARN.forEach((col, ci) => {
      const x = 120 + ci * 580;
      const cs = sc.s + 0.4 + ci * 0.35;
      const k = p(t, cs, 0.5);
      if (k <= 0) return;
      ctx.save();
      ctx.globalAlpha *= k;
      text(col.en, x, 380, { font: MONO, size: 20, color: C.cool, ls: 3 });
      text(col.h, x, 428, { size: 38, w: 700 });
      line(x, 452, x + 500 * k, 452, C.cool, 0.7, 2);
      col.items.forEach((s, i) => {
        const kk = p(t, cs + 0.35 + i * 0.22, 0.45);
        if (kk <= 0) return;
        const y = 516 + i * 76;
        text(s, x + (1 - kk) * 24, y, { size: 29, w: 400, a: kk });
        line(x, y + 26, x + 500, y + 26, C.text, 0.07 * kk);
      });
      ctx.restore();
    });
    ctx.restore();
  }

  // ---------- scene 5: closing ----------
  function drawClose(t) {
    const sc = SCENES[5];
    const a = Math.min(p(t, sc.s, 0.5), 1 - p(t, 29.2, 0.8));
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    text('先解决身份，再补齐本地资质，然后深入市场规则。', W / 2, 290, { size: 44, w: 500, align: 'center' });

    const nodes = [
      [480, '身份', '合法工作签证'],
      [960, '资质', 'EA 评估 · 持证上岗'],
      [1440, '规则', 'NEM · 标准 · 安全']
    ];
    const lk = p(t, sc.s + 0.3, 1.6);
    line(480, 440, 480 + 960 * lk, 440, C.copper, 0.8, 2);
    nodes.forEach(([x, h, s], i) => {
      const k = p(t, sc.s + 0.3 + i * 0.5, 0.5);
      if (k <= 0) return;
      ctx.save();
      ctx.globalAlpha *= k;
      ctx.fillStyle = C.ink;
      ctx.strokeStyle = C.copper; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, 440, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.copper;
      ctx.beginPath(); ctx.arc(x, 440, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      text(h, x, 520, { size: 44, w: 700, align: 'center', a: k });
      text(s, x, 564, { size: 24, w: 300, color: C.muted, align: 'center', a: k });
    });
    const da = p(t, sc.s + 1.4, 0.8);
    text('签证与政策会调整，请以澳大利亚内政部 immi.homeaffairs.gov.au 的最新信息为准。', W / 2, 680, { size: 22, w: 300, color: C.muted, align: 'center', a: da });
    text('本片信息截至 2026 年，仅作就业参考，不构成移民或法律建议。', W / 2, 716, { size: 22, w: 300, color: C.muted, align: 'center', a: da });
    ctx.restore();
  }

  function render(t) {
    drawBackground(t);
    drawChrome(t);
    drawTitle(t);
    drawList(t, SCENES[1], VISAS);
    drawList(t, SCENES[2], QUALS);
    drawLearn(t);
    drawList(t, SCENES[4], ISSUES);
    drawClose(t);
    if (t > 29.2) { // final fade to black
      ctx.save();
      ctx.globalAlpha = p(t, 29.2, 0.8) * 0.85;
      ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // ---------- music: Web Audio synthesis ----------
  let actx = null, bus = null, recDest = null;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function makeImpulse(ac, sec, decay) {
    const len = Math.floor(ac.sampleRate * sec);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function scheduleMusic(t0) {
    const ac = actx;
    const out = ac.createGain();
    out.gain.setValueAtTime(0, t0);
    out.gain.linearRampToValueAtTime(0.9, t0 + 1.2);
    out.gain.setValueAtTime(0.9, t0 + 27.2);
    out.gain.linearRampToValueAtTime(0, t0 + DUR);
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;
    out.connect(comp);
    comp.connect(bus);

    const verb = ac.createConvolver();
    verb.buffer = makeImpulse(ac, 3.2, 2.6);
    const verbGain = ac.createGain(); verbGain.gain.value = 0.35;
    verb.connect(verbGain); verbGain.connect(out);

    const delay = ac.createDelay(1); delay.delayTime.value = 0.352;
    const fb = ac.createGain(); fb.gain.value = 0.28;
    const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
    delay.connect(dlp); dlp.connect(fb); fb.connect(delay);
    const dOut = ac.createGain(); dOut.gain.value = 0.35;
    dlp.connect(dOut); dOut.connect(out); dOut.connect(verb);

    // A minor, one chord every 3.75 s (two bars at 128 bpm)
    const CH = 3.75;
    const prog = [
      [45, [57, 60, 64, 71]], // Am9
      [41, [53, 57, 60, 64]], // Fmaj7
      [48, [55, 60, 64, 67]], // C
      [43, [55, 59, 62, 67]], // G
      [45, [57, 60, 64, 71]], // Am9
      [41, [53, 57, 60, 64]], // Fmaj7
      [38, [53, 57, 60, 62]], // Dm7
      [45, [57, 60, 64, 69]]  // Am
    ];

    prog.forEach(([root, notes], ci) => {
      const s = t0 + ci * CH, e = s + CH;
      // pad
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 0.4;
      lp.frequency.setValueAtTime(700, s);
      lp.frequency.linearRampToValueAtTime(1500, s + CH * 0.6);
      lp.frequency.linearRampToValueAtTime(900, e + 1.2);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(0.05, s + 0.9);
      g.gain.setValueAtTime(0.05, e - 0.2);
      g.gain.linearRampToValueAtTime(0, e + 1.4);
      lp.connect(g); g.connect(out); g.connect(verb);
      notes.forEach(n => {
        [-7, 7].forEach(cents => {
          const o = ac.createOscillator();
          o.type = 'sawtooth';
          o.frequency.value = mtof(n);
          o.detune.value = cents;
          const vg = ac.createGain(); vg.gain.value = 0.22;
          o.connect(vg); vg.connect(lp);
          o.start(s); o.stop(e + 1.5);
        });
      });
      // bass
      const b = ac.createOscillator(); b.type = 'sine'; b.frequency.value = mtof(root);
      const bg = ac.createGain();
      bg.gain.setValueAtTime(0, s);
      bg.gain.linearRampToValueAtTime(0.16, s + 0.3);
      bg.gain.setValueAtTime(0.16, e - 0.3);
      bg.gain.linearRampToValueAtTime(0, e + 0.2);
      b.connect(bg); bg.connect(out);
      b.start(s); b.stop(e + 0.3);

      // arpeggio (eighths) from 4 s to 26 s
      const step = CH / 16;
      const pat = [0, 2, 1, 3, 2, 1, 3, 2, 0, 2, 1, 3, 2, 3, 1, 2];
      for (let i = 0; i < 16; i++) {
        const at = s + i * step;
        if (at - t0 < 3.75 || at - t0 > 26.2) continue;
        const o = ac.createOscillator(); o.type = 'triangle';
        o.frequency.value = mtof(notes[pat[i]] + 12);
        const ag = ac.createGain();
        const vel = i % 4 === 0 ? 0.075 : 0.045;
        ag.gain.setValueAtTime(0, at);
        ag.gain.linearRampToValueAtTime(vel, at + 0.008);
        ag.gain.exponentialRampToValueAtTime(0.0008, at + 0.32);
        o.connect(ag); ag.connect(out); ag.connect(delay);
        o.start(at); o.stop(at + 0.36);
      }
      // soft sub pulse on each beat, 4 s to 26 s
      for (let i = 0; i < 8; i++) {
        const at = s + i * (CH / 8);
        if (at - t0 < 3.75 || at - t0 > 26.2) continue;
        const o = ac.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(90, at);
        o.frequency.exponentialRampToValueAtTime(48, at + 0.18);
        const kg = ac.createGain();
        kg.gain.setValueAtTime(0, at);
        kg.gain.linearRampToValueAtTime(i % 2 ? 0.07 : 0.12, at + 0.005);
        kg.gain.exponentialRampToValueAtTime(0.0008, at + 0.3);
        o.connect(kg); kg.connect(out);
        o.start(at); o.stop(at + 0.32);
      }
    });

    // filtered-noise swells marking each section change
    const noise = ac.createBuffer(1, ac.sampleRate * 1.2, ac.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    [4, 10, 15.5, 21.5, 26.5].forEach(st => {
      const at = t0 + st - 0.7;
      const src = ac.createBufferSource(); src.buffer = noise;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(400, at);
      bp.frequency.exponentialRampToValueAtTime(3200, at + 0.75);
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0, at);
      ng.gain.linearRampToValueAtTime(0.05, at + 0.7);
      ng.gain.linearRampToValueAtTime(0, at + 1.1);
      src.connect(bp); bp.connect(ng); ng.connect(out); ng.connect(verb);
      src.start(at); src.stop(at + 1.2);
    });
  }

  // ---------- playback ----------
  const playBtn = document.getElementById('play');
  const muteBox = document.getElementById('mute');
  const recBtn = document.getElementById('rec');
  const recState = document.getElementById('recState');
  let t0 = null, playing = false, raf = 0, recorder = null, chunks = [];

  function ensureAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      recDest = actx.createMediaStreamDestination();
    }
    if (actx.state === 'suspended') actx.resume();
  }

  function start(withRecording) {
    ensureAudio();
    if (bus) { try { bus.disconnect(); } catch (e) {} }
    bus = actx.createGain();
    bus.gain.value = muteBox.checked ? 0 : 1;
    bus.connect(actx.destination);
    const recTap = actx.createGain();
    bus.connect(recTap); recTap.connect(recDest);
    t0 = actx.currentTime + 0.1;
    scheduleMusic(t0);
    playing = true;
    playBtn.hidden = true;
    if (withRecording) startRecording();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function loop() {
    const t = Math.max(0, actx.currentTime - t0);
    render(Math.min(t, DUR));
    if (t < DUR) raf = requestAnimationFrame(loop);
    else finish();
  }

  function finish() {
    playing = false;
    if (recorder && recorder.state === 'recording') recorder.stop();
  }

  function startRecording() {
    if (!window.MediaRecorder || !cv.captureStream) {
      recState.textContent = '当前浏览器不支持导出';
      return;
    }
    const stream = new MediaStream([
      ...cv.captureStream(30).getVideoTracks(),
      ...recDest.stream.getAudioTracks()
    ]);
    const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mimeType = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    chunks = [];
    recorder = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: 8e6 } : undefined);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      recState.innerHTML = '';
      const a = document.createElement('a');
      a.href = url; a.download = 'au-energy-storage-guide.webm';
      a.textContent = '下载 au-energy-storage-guide.webm';
      recState.appendChild(a);
      a.click();
    };
    recorder.start(250);
    recState.textContent = '录制中，约 30 秒…';
  }

  playBtn.addEventListener('click', () => start(false));
  document.getElementById('replay').addEventListener('click', () => start(false));
  recBtn.addEventListener('click', () => {
    if (recorder && recorder.state === 'recording') return;
    start(true);
  });
  muteBox.addEventListener('change', () => {
    if (bus && actx) bus.gain.setTargetAtTime(muteBox.checked ? 0 : 1, actx.currentTime, 0.05);
  });

  // resting frame: the finished title card
  const still = () => { if (!playing) render(3.3); };
  still();
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load(`700 86px "Noto Sans SC"`, '以中国身份'),
      document.fonts.load(`300 32px "Noto Sans SC"`, '签证'),
      document.fonts.load(`500 24px "IBM Plex Mono"`, 'SOC')
    ]).then(still, still);
    document.fonts.ready.then(still);
  }
})();
</script>
